spring:
  application:
    name: autentificador

  # Banco e RabbitMQ vêm do compose.yaml (spring-boot-docker-compose), igual à API de funções.
  # Fora do Docker Compose, use as variáveis SPRING_DATASOURCE_* e SPRING_RABBITMQ_* (ver CLAUDE.md).

  # Flyway: migrations com o padrão M_AUT_VXX__descricao.sql
  # Histórico próprio para não misturar com o flyway_schema_history da API de funções.
  # baseline-version 0: no schema já existente, aplica a partir da M_AUT_V01.
  flyway:
    locations: classpath:db/migration
    sql-migration-prefix: M_AUT_V
    table: flyway_historico_autenticacao
    baseline-on-migrate: true
    baseline-version: 0

  # O schema é gerenciado só pelo Flyway: o Hibernate não cria nem altera tabelas
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

# Porta fixa da API de autenticação (padrão de portas no CLAUDE.md)
server:
  port: 8081

# JWT: mesmo segredo da API de funções para assinar os tokens (HS256, mínimo 32 caracteres).
# Em produção, defina a variável de ambiente JWT_SEGREDO.
jwt:
  segredo: "${JWT_SEGREDO:ajudante-familiar-segredo-dev-troque-em-producao}"
