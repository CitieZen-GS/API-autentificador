# Configuração extra, só nos testes (AutentificadorApplicationTests e TestAutentificadorApplication).
# O Spring lê classpath:/config/application.yaml além do application.yaml principal, sem substituí-lo.
spring:
  flyway:
    # O Oracle do Testcontainers começa vazio: as migrations de teste (versões 0.1 a 0.5) criam as
    # tabelas da API de funções e, depois delas, rodam as M_AUT_V01 e V02 da autenticação.
    locations: classpath:db/migration,classpath:db/migration-teste
